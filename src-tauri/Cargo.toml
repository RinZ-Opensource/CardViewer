[package]
name = "configarc-card-viewer"
version = "0.1.0"
description = "Card previewer for CardMaker packages"
authors = ["ConfigArc"]
license = ""
repository = ""
edition = "2021"
default-run = "configarc-card-viewer"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
