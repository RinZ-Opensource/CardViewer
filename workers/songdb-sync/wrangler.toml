# cardviewer-songdb: upstream-to-R2 metadata synchronization producer.
# See README.md for bucket binding, secret setup and deploy steps.
name = "cardviewer-songdb"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Daily metadata refresh (04:17 JST). Every GET route is R2-only and returns
# 404 on a miss; regular and HD jackets are uploaded out-of-band.
[triggers]
crons = ["17 19 * * *"]

[[r2_buckets]]
binding = "SONGDB"
# The existing CardViewer bucket is shared with reviewed public asset keys. The
# worker only reads/writes under songdb/. Do not attach a bucket-level public
# domain that would bypass the Pages Function allowlist for other prefixes.
bucket_name = "cardviewer-assets"
