name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/songdb-sync/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm --prefix workers/songdb-sync ci

      - name: Run web checks
        run: npm run check

  rust:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src-tauri/requirements-test.txt

      - name: Install Rust test Python dependencies
        run: >-
          python -m pip install --requirement src-tauri/requirements-test.txt
          --only-binary=:all:

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        env:
          CARDVIEWER_PYTHON: python
